[project]
name = "netra-ml"
version = "0.1.0"
description = "Diabetic retinopathy screening model: training, evaluation and ONNX export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.1",
    "kaggle>=1.6",
    "six>=1.17.0",
]

[tool.uv]
package = false
